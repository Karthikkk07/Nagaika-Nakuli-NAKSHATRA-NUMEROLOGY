<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Admin Login | Nagaika, Nakuli Numerology</title>
<link rel="icon" type="image/svg+xml" href="/img/favicon.svg">
<style>
:root{--yellow:#fbb917;--orange:#ee6a12;--orange-d:#d4570a;--maroon:#7a1f0b;--cream:#fff6e0;--line:#ecd9a8}
*{box-sizing:border-box}
body{font-family:"Segoe UI",system-ui,sans-serif;background:#fbe6b5 radial-gradient(circle at 50% 50%,rgba(238,106,18,.16) 0 5px,transparent 6px) 0 0/56px 56px;color:#262626;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
form{background:#fff;border-radius:12px;box-shadow:0 4px 24px rgba(122,59,0,.25);width:min(380px,100%);overflow:hidden}
.top{background:var(--yellow);padding:18px;text-align:center}
.top img{height:56px;display:block;margin:0 auto 6px}
.top b{color:var(--maroon);font-size:1.05rem}
.body{padding:22px 26px 26px}
h1{margin:0 0 6px;font-size:1.3rem;color:var(--orange)}
.sub{margin:0 0 8px;color:#6b6b6b;font-size:.88rem}
label{display:block;font-weight:600;margin:14px 0 4px;font-size:.9rem}
input{width:100%;padding:10px 12px;border:1px solid #d9c690;border-radius:6px;font:inherit}
input:focus{outline:2px solid var(--yellow);border-color:transparent}
button{margin-top:20px;width:100%;background:var(--orange);border:0;padding:12px;border-radius:6px;font:inherit;font-weight:700;cursor:pointer;color:#fff}
button:hover{background:var(--orange-d)}
#err{color:#b3261e;min-height:1.2em;margin-top:12px;font-size:.9rem}
</style>
</head>
<body>
<form id="f">
  <div class="top"><img src="/img/logo.png" alt="" onerror="this.remove()"><b>Nagaika, Nakuli Numerology</b></div>
  <div class="body">
    <h1>Admin Login</h1>
    <p class="sub">Sign in to manage enquiries, blogs and videos.</p>
    <label for="u">Username</label><input id="u" autocomplete="username" value="admin">
    <label for="p">Password</label><input id="p" type="password" autocomplete="current-password" autofocus>
    <button type="submit">Sign in</button>
    <div id="err"></div>
  </div>
</form>
<script>
document.getElementById('f').addEventListener('submit', function (e) {
  e.preventDefault();
  fetch('/admin/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: document.getElementById('u').value, password: document.getElementById('p').value }) })
    .then(function (r) { return r.json(); })
    .then(function (d) { if (d.ok) location.href = '/admin/'; else document.getElementById('err').textContent = d.error || 'Login failed.'; })
    .catch(function () { document.getElementById('err').textContent = 'Network error.'; });
});
</script>
</body>
</html>
